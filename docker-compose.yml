services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: office
      POSTGRES_DB: office_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d office_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://office:office@postgres:5432/office_agent
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/data
    command: ["sh", "-c", "alembic upgrade head && python -m office_agent.mcp.server"]
volumes:
  postgres_data:
  app_data:
